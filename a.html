<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">حفل زفاف أحمد وملكة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fbf9f5;
            --card-bg: #ffffff;
            --primary-color: #2c2522;
            --accent-gold: #c5a059;
            --accent-gold-dark: #a3813e;
            --accent-rose: #d4a373;
            --text-main: #4a403b;
            --text-muted: #7c716b;
            --border-color: #e6dfd5;
            --shadow-soft: 0 10px 30px rgba(44, 37, 34, 0.05);
            --transition-smooth: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            direction: rtl;
            overflow-x: hidden;
            line-height: 1.8;
        }

        h1, h2, h3, .amiri-font {
            font-family: 'Amiri', serif;
        }

        /* شاشة البداية */
        #welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #fbf9f5 0%, #f4eee1 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #welcome-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .welcome-card {
            text-align: center;
            padding: 3rem;
            max-width: 600px;
            width: 90%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-soft);
            border-radius: 12px;
            position: relative;
        }

        .welcome-card::before {
            content: '';
            position: absolute;
            top: 10px; right: 10px; bottom: 10px; left: 10px;
            border: 1px dashed var(--accent-gold);
            pointer-events: none;
            border-radius: 8px;
        }

        .welcome-card h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .welcome-card p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .btn-gold {
            background-color: var(--accent-gold);
            color: #fff;
            border: none;
            padding: 0.9rem 2.5rem;
            font-size: 1.1rem;
            font-family: 'Tajawal', sans-serif;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.3);
        }

        .btn-gold:hover {
            background-color: var(--accent-gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(197, 160, 89, 0.4);
        }

        /* المحتوى الرئيسي */
        #main-content {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease 0.3s;
        }

        #main-content.visible {
            opacity: 1;
            visibility: visible;
        }

        header.hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            background: radial-gradient(circle, rgba(244,238,225,0.5) 0%, rgba(251,249,245,1) 100%);
        }

        .hero-names {
            font-size: 3.5rem;
            color: var(--primary-color);
            margin: 1.5rem 0;
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            color: var(--accent-gold-dark);
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        /* العداد التنازلي المدمج */
        .countdown-container {
            display: flex;
            gap: 1.5rem;
            margin: 2rem 0;
            background: var(--card-bg);
            padding: 1rem 2rem;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-soft);
        }

        .countdown-item {
            text-align: center;
        }

        .countdown-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-gold-dark);
        }

        .countdown-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* الأقسام العامة */
        section {
            padding: 5rem 1.5rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 3rem;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            background-color: var(--accent-gold);
            margin: 0.75rem auto 0;
        }

        /* قسم الذكريات والشبكة */
        .memories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .memory-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-color);
            transition: var(--transition-smooth);
            cursor: pointer;
        }

        .memory-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(44, 37, 34, 0.1);
        }

        .memory-img-wrapper {
            width: 100%;
            height: 280px;
            background-color: #eee;
            position: relative;
            overflow: hidden;
        }

        .memory-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .memory-card:hover .memory-img-wrapper img {
            transform: scale(1.05);
        }

        .memory-caption {
            padding: 1rem;
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        /* تفاصيل الحفل والقاعة */
        .details-card {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-soft);
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2.5rem;
            text-align: right;
        }

        .detail-item h3 {
            color: var(--accent-gold-dark);
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }

        .detail-item p {
            color: var(--text-main);
            font-size: 1.05rem;
        }

        /* قسم التهاني والتعليقات */
        .wishes-section {
            background: #f4eee1;
            border-radius: 16px;
            padding: 4rem 2rem;
            margin: 3rem auto;
            max-width: 900px;
        }

        .wish-form {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 3rem;
            box-shadow: var(--shadow-soft);
        }

        .form-group {
            margin-bottom: 1.25rem;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--primary-color);
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            background: var(--bg-color);
            color: var(--text-main);
            transition: var(--transition-smooth);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-gold);
            background: #fff;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .honeypot-field {
            display: none !important;
        }

        .wishes-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 500px;
            overflow-y: auto;
            padding-left: 0.5rem;
        }

        .wish-item {
            background: var(--card-bg);
            padding: 1.25rem 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .wish-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .wish-author {
            font-weight: 700;
            color: var(--primary-color);
        }

        .wish-date {
            color: var(--text-muted);
        }

        .wish-message {
            color: var(--text-main);
            font-size: 1rem;
        }

        /* الأزرار العائمة */
        .floating-actions {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 1000;
        }

        .float-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: var(--shadow-soft);
            transition: var(--transition-smooth);
            font-size: 1.2rem;
        }

        .float-btn:hover {
            background-color: var(--accent-gold);
            color: #fff;
            border-color: var(--accent-gold);
            transform: scale(1.05);
        }

        .float-btn.active {
            background-color: var(--accent-gold);
            color: #fff;
            border-color: var(--accent-gold);
        }

        /* Lightbox للصور */
        #lightbox {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 37, 34, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-smooth);
            padding: 2rem;
        }

        #lightbox.active {
            opacity: 1;
            visibility: visible;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 6px;
            border: 2px solid var(--accent-gold);
        }

        #lightbox-close {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
        }

        /* إشعارات الحالة */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 50%;
            transform: translateX(50%) translateY(100px);
            background: var(--primary-color);
            color: #fff;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.4s ease;
            z-index: 10001;
            font-size: 0.95rem;
        }

        .toast.show {
            transform: translateX(50%) translateY(0);
        }

        @media (max-width: 768px) {
            .hero-names { font-size: 2.5rem; }
            .details-grid { grid-template-columns: 1fr; gap: 1rem; }
            .countdown-container { padding: 0.8rem 1rem; gap: 0.75rem; }
            .countdown-number { font-size: 1.2rem; }
            .floating-actions { bottom: 1rem; left: 1rem; }
        }
    </style>
</head>
<body>

    <!-- شاشة البداية -->
    <div id="welcome-overlay">
        <div class="welcome-card">
            <h1 id="ov-names">أحمد & ملك</h1>
            <p id="ov-intro">يسعدنا حضوركم لشاركة فرحتنا الكبرى</p>
            <button class="btn-gold" id="open-invitation-btn">افتح دعوتك</button>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div id="main-content">
        
        <!-- القسم الرئيسي (Hero) -->
        <header class="hero-section">
            <span class="hero-subtitle" id="hero-subtitle">دعوة زفاف مباركة</span>
            <h1 class="hero-names" id="main-names">أحمد & ملك</h1>
            <p id="welcome-text" style="max-width: 600px; color: var(--text-muted); margin-bottom: 1.5rem;"></p>
            
            <div class="countdown-container" id="countdown-box">
                <div class="countdown-item">
                    <div class="countdown-number" id="cd-days">00</div>
                    <div class="countdown-label">يوم</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="cd-hours">00</div>
                    <div class="countdown-label">ساعة</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="cd-mins">00</div>
                    <div class="countdown-label">دقيقة</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="cd-secs">00</div>
                    <div class="countdown-label">ثانية</div>
                </div>
            </div>
        </header>

        <!-- قسم الذكريات -->
        <section id="memories-section">
            <h2 class="section-title" id="memories-title">حكاية بدأت وأصبحت أجمل</h2>
            <div class="memories-grid" id="memories-container">
                <!-- يتم تعبئتها ديناميكياً من JSON -->
            </div>
        </section>

        <!-- قسم تفاصيل الحفل -->
        <section id="details-section">
            <h2 class="section-title" id="details-title">تفاصيل الحفل</h2>
            <div class="details-card">
                <div class="details-grid">
                    <div class="detail-item">
                        <h3 id="lbl-date">تاريخ الحفل</h3>
                        <p id="val-date">--</p>
                    </div>
                    <div class="detail-item">
                        <h3 id="lbl-time">وقت البداية</h3>
                        <p id="val-time">--</p>
                    </div>
                    <div class="detail-item">
                        <h3 id="lbl-hall">اسم القاعة</h3>
                        <p id="val-hall">--</p>
                    </div>
                    <div class="detail-item">
                        <h3 id="lbl-address">العنوان</h3>
                        <p id="val-address">--</p>
                    </div>
                </div>
                <a href="#" id="map-btn" target="_blank" class="btn-gold" style="display:inline-block; text-decoration:none;">افتح الموقع على خرائط Google</a>
            </div>
        </section>

        <!-- قسم دفتر التهاني -->
        <section class="wishes-section" id="wishes-section">
            <h2 class="section-title" id="wishes-title">دفتر التهاني</h2>
            
            <div class="wish-form">
                <form id="comment-form">
                    <div class="honeypot-field">
                        <input type="text" name="website" id="website" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="guest-name">اسمك الكريم</label>
                        <input type="text" id="guest-name" class="form-control" required maxlength="50" placeholder="أدخل اسمك أو صفتك...">
                    </div>
                    <div class="form-group">
                        <label for="guest-message">رسالة التهنئة للعروسين</label>
                        <textarea id="guest-message" class="form-control" required maxlength="300" placeholder="اكتب أمنيتك الجميلة للعروسين..."></textarea>
                    </div>
                    <button type="submit" class="btn-gold" id="submit-wish-btn">إرسال التهنئة</button>
                </form>
            </div>

            <div class="wishes-list" id="wishes-list-container">
                <p style="text-align: center; color: var(--text-muted);" id="loading-wishes">جاري تحميل التهاني...</p>
            </div>
        </section>

    </div>

    <!-- أزرار التحكم العائمة -->
    <div class="floating-actions" id="floating-actions" style="display: none;">
        <button class="float-btn" id="scroll-cinematic-btn" title="التمرير التلقائي السينمائي">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
        </button>
        <button class="float-btn" id="music-toggle-btn" title="تشغيل / إيقاف الموسيقى">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        </button>
        <button class="float-btn" id="share-btn" title="مشاركة الدعوة">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        </button>
    </div>

    <!-- Lightbox للصور -->
    <div id="lightbox">
        <button id="lightbox-close">&times;</button>
        <img id="lightbox-img" src="" alt="صورة مكبرة">
    </div>

    <!-- عنصر الصوت -->
    <audio id="bg-audio" loop preload="auto"></audio>

    <!-- إشعار Toast -->
    <div class="toast" id="toast-notification">تمت العملية بنجاح</div>

    <script>
        let appData = {};
        let audioPlayer = document.getElementById('bg-audio');
        let isCinematicScrolling = false;
        let cinematicAnimationId = null;

        // البيانات الاحتياطية في حال تعذر جلب data.json
        const fallbackData = {
            groomName: "أحمد",
            brideName: "ملك",
            fullNamesTitle: "أحمد & ملك",
            heroSubtitle: "دعوة زفاف مباركة",
            welcomeOverlayText: "يسعدنا حضوركم لشاركة فرحتنا الكبرى",
            openButtonText: "افتح دعوتك",
            welcomeParagraph: "في ليلة من ليالي العمر، وبحضور من نحب، نتشرف بدعوتكم لحضور حفل زفافنا المبروك.",
            weddingDate: "2026-12-31T20:00:00",
            hallName: "قاعة النخبة الكبرى",
            hallAddress: "القاهرة، مصر",
            googleMapsUrl: "https://maps.google.com",
            audioFile: "audio/a1.mp3",
            googleScriptUrl: "",
            sections: { memories: true, details: true, wishes: true },
            memories: [
                { image: "images/memory-01.jpg", caption: "بداية الحكاية" },
                { image: "images/memory-02.jpg", caption: "أجمل اللحظات" },
                { image: "images/memory-03.jpg", caption: "معاً نبني المستقبل" },
                { image: "images/memory-04.jpg", caption: "فرحة العمر" }
            ],
            messages: {
                successWish: "تم إرسال تهنئتك بنجاح!",
                errorWish: "حدث خطأ أثناء الإرسال، يرجى المحاولة لاحقاً."
            }
        };

        async function initApp() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Network response was not ok');
                appData = await response.json();
            } catch (error) {
                console.warn('تعذر تحميل data.json، يتم استخدام البيانات الافتراضية.', error);
                appData = fallbackData;
            }

            renderUI();
            setupEventListeners();
            fetchComments();
        }

        function renderUI() {
            document.getElementById('page-title').textContent = `حفل زفاف ${appData.groomName || 'أحمد'} & ${appData.brideName || 'ملك'}`;
            document.getElementById('ov-names').textContent = appData.fullNamesTitle || `${appData.groomName} & ${appData.brideName}`;
            document.getElementById('ov-intro').textContent = appData.welcomeOverlayText;
            document.getElementById('open-invitation-btn').textContent = appData.openButtonText;

            document.getElementById('hero-subtitle').textContent = appData.heroSubtitle;
            document.getElementById('main-names').textContent = appData.fullNamesTitle || `${appData.groomName} & ${appData.brideName}`;
            document.getElementById('welcome-text').textContent = appData.welcomeParagraph;

            // تفاصيل الحفل
            document.getElementById('val-date').textContent = appData.weddingDate ? new Date(appData.weddingDate).toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' }) : 'قريباً';
            document.getElementById('val-time').textContent = appData.weddingTime || 'الثامنة مساءً';
            document.getElementById('val-hall').textContent = appData.hallName;
            document.getElementById('val-address').textContent = appData.hallAddress;
            
            const mapBtn = document.getElementById('map-btn');
            if (appData.googleMapsUrl) {
                mapBtn.href = appData.googleMapsUrl;
            } else {
                mapBtn.style.display = 'none';
            }

            // ملف الصوت
            if (appData.audioFile) {
                audioPlayer.src = appData.audioFile;
            }

            // الذكريات
            const memoriesContainer = document.getElementById('memories-container');
            memoriesContainer.innerHTML = '';
            if (appData.memories && Array.isArray(appData.memories)) {
                appData.memories.forEach(mem => {
                    const card = document.createElement('div');
                    card.className = 'memory-card';
                    card.innerHTML = `
                        <div class="memory-img-wrapper">
                            <img src="${mem.image}" alt="${mem.caption}" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"300\" height=\"300\" viewBox=\"0 0 300 300\"><rect width=\"300\" height=\"300\" fill=\"%23eee\"/><text x=\"50%\" y=\"50%\" dominant-baseline=\"middle\" text-anchor=\"middle\" fill=\"%23aaa\" font-family=\"sans-serif\">صورة الذكرى</text></svg>'">
                        </div>
                        <div class="memory-caption">${mem.caption}</div>
                    `;
                    card.addEventListener('click', () => openLightbox(mem.image));
                    memoriesContainer.appendChild(card);
                });
            }

            // العداد التنازلي
            if (appData.weddingDate) {
                startCountdown(new Date(appData.weddingDate).getTime());
            } else {
                document.getElementById('countdown-box').style.display = 'none';
            }
        }

        function setupEventListeners() {
            const overlay = document.getElementById('welcome-overlay');
            const mainContent = document.getElementById('main-content');
            const floatingActions = document.getElementById('floating-actions');

            document.getElementById('open-invitation-btn').addEventListener('click', () => {
                overlay.classList.add('fade-out');
                mainContent.classList.add('visible');
                floatingActions.style.display = 'flex';
                
                if (audioPlayer.src) {
                    audioPlayer.play().catch(e => console.log("المتصفح منع التشغيل التلقائي للصوت:", e));
                }
            });

            // أزرار التحكم العائمة
            const musicBtn = document.getElementById('music-toggle-btn');
            musicBtn.addEventListener('click', () => {
                if (audioPlayer.paused) {
                    audioPlayer.play();
                    musicBtn.classList.add('active');
                    showToast("تم تشغيل الموسيقى");
                } else {
                    audioPlayer.pause();
                    musicBtn.classList.remove('active');
                    showToast("تم إيقاف الموسيقى");
                }
            });

            const scrollBtn = document.getElementById('scroll-cinematic-btn');
            scrollBtn.addEventListener('click', toggleCinematicScroll);

            const shareBtn = document.getElementById('share-btn');
            shareBtn.addEventListener('click', () => {
                if (navigator.share) {
                    navigator.share({
                        title: document.title,
                        url: window.location.href
                    }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(window.location.href);
                    showToast("تم نسخ رابط الدعوة إلى الحافظة!");
                }
            });

            // تفاعل إيقاف التمرير السينمائي عند لمس الشاشة
            window.addEventListener('wheel', stopCinematicScroll);
            window.addEventListener('touchstart', stopCinematicScroll);

            // Lightbox
            const lightbox = document.getElementById('lightbox');
            document.getElementById('lightbox-close').addEventListener('click', () => {
                lightbox.classList.remove('active');
            });
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) lightbox.classList.remove('active');
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') lightbox.classList.remove('active');
            });

            // نموذج التعليقات
            const commentForm = document.getElementById('comment-form');
            commentForm.addEventListener('submit', handleCommentSubmit);
        }

        function openLightbox(imgSrc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = imgSrc;
            lightbox.classList.add('active');
        }

        function startCountdown(targetTime) {
            const daysEl = document.getElementById('cd-days');
            const hoursEl = document.getElementById('cd-hours');
            const minsEl = document.getElementById('cd-mins');
            const secsEl = document.getElementById('cd-secs');

            function update() {
                const now = new Date().getTime();
                const distance = targetTime - now;

                if (distance < 0) {
                    document.getElementById('countdown-box').innerHTML = "<span style='color:var(--accent-gold-dark); font-weight:bold;'>لقد بدأت ليلة عمرنا المرجوة!</span>";
                    clearInterval(timerInterval);
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((distance % (1000 * 60)) / 1000);

                daysEl.textContent = String(days).padStart(2, '0');
                hoursEl.textContent = String(hours).padStart(2, '0');
                minsEl.textContent = String(mins).padStart(2, '0');
                secsEl.textContent = String(secs).padStart(2, '0');
            }

            update();
            const timerInterval = setInterval(update, 1000);
        }

        function toggleCinematicScroll() {
            const scrollBtn = document.getElementById('scroll-cinematic-btn');
            if (isCinematicScrolling) {
                stopCinematicScroll();
            } else {
                isCinematicScrolling = true;
                scrollBtn.classList.add('active');
                showToast("بدء التمرير السينمائي");
                
                function step() {
                    if (!isCinematicScrolling) return;
                    window.scrollBy(0, 1);
                    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 10) {
                        stopCinematicScroll();
                        return;
                    }
                    cinematicAnimationId = requestAnimationFrame(step);
                }
                cinematicAnimationId = requestAnimationFrame(step);
            }
        }

        function stopCinematicScroll() {
            if (isCinematicScrolling) {
                isCinematicScrolling = false;
                document.getElementById('scroll-cinematic-btn').classList.remove('active');
                if (cinematicAnimationId) cancelAnimationFrame(cinematicAnimationId);
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast-notification');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        async function fetchComments() {
            const listContainer = document.getElementById('wishes-list-container');
            if (!appData.googleScriptUrl) {
                listContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted);">خدمة التعليقات غير مهيأة حالياً.</p>';
                return;
            }

            try {
                const response = await fetch(appData.googleScriptUrl);
                const result = await response.json();
                if (result && Array.isArray(result.comments)) {
                    renderComments(result.comments);
                } else {
                    listContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted);">لا توجد تهاني منشورة حتى الآن. كن أول المهنئين!</p>';
                }
            } catch (error) {
                console.error("خطأ في جلب التعليقات:", error);
                listContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted);">تعذر تحميل التهاني في الوقت الحالي.</p>';
            }
        }

        function renderComments(comments) {
            const listContainer = document.getElementById('wishes-list-container');
            listContainer.innerHTML = '';
            if (comments.length === 0) {
                listContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted);">لا توجد تهاني منشورة حتى الآن.</p>';
                return;
            }

            comments.forEach(c => {
                const item = document.createElement('div');
                item.className = 'wish-item';
                
                // تنظيف آمن للمدخلات لمنع XSS
                const safeName = escapeHtml(c.guestName);
                const safeMsg = escapeHtml(c.message);
                const safeDate = escapeHtml(c.createdAt || '');

                item.innerHTML = `
                    <div class="wish-header">
                        <span class="wish-author">${safeName}</span>
                        <span class="wish-date">${safeDate}</span>
                    </div>
                    <div class="wish-message">${safeMsg}</div>
                `;
                listContainer.appendChild(item);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        async function handleCommentSubmit(e) {
            e.preventDefault();
            
            // التحقق من الحقل الوهمي (Honeypot)
            if (document.getElementById('website').value !== "") {
                return; 
            }

            const nameInput = document.getElementById('guest-name');
            const msgInput = document.getElementById('guest-message');
            const submitBtn = document.getElementById('submit-wish-btn');

            const guestName = nameInput.value.trim();
            const message = msgInput.value.trim();

            if (!guestName || !message) {
                showToast("يرجى ملء جميع الحقول المطلوبة.");
                return;
            }

            if (!appData.googleScriptUrl) {
                showToast("عذراً، نظام الحفظ غير مفعل حالياً.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "جاري الإرسال...";

            try {
                // استخدام نمط إرسال آمن متوافق مع Apps Script Web App
                await fetch(appData.googleScriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ guestName, message })
                });

                showToast("تم إرسال تهنئتك بنجاح! ستظهر بعد المراجعة.");
                nameInput.value = '';
                msgInput.value = '';
                
                // إعادة جلب التعليقات بعد قليل
                setTimeout(fetchComments, 2000);
            } catch (error) {
                console.error("خطأ في الإرسال:", error);
                showToast("حدث خطأ أثناء الإرسال، يرجى المحاولة لاحقاً.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "إرسال التهنئة";
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
